<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School of Accidental Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Narrow:wght@700&family=Saira+Condensed:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--deep:#04121b;--navy:#12324a;--blue:#1d5f8c;--sky:#3a9bd5;--ice:#8cc8de;--paper:#f6f3ec;--ink:#14212b;--muted:#5f7180}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
body{margin:0;font-family:"Archivo",system-ui,sans-serif;color:#fff;background:var(--deep);line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* header */
header{background:linear-gradient(180deg,#2b7fb8,#1d5f8c);padding:40px 0 34px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:16px;color:var(--ice);text-decoration:none}
.lockup svg{width:84px;height:84px;flex:none}
.lockup span{font-family:"Saira Condensed",sans-serif;font-weight:300;font-size:30px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.btn{display:inline-block;font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;padding:13px 22px;border-radius:3px;border:0;cursor:pointer;text-decoration:none;color:#fff;background:var(--sky)}
.btn:hover{background:#4aa9e2}
.btn.light{background:#fff;color:var(--navy)}
.btn.light:hover{background:var(--paper)}
.btn:disabled{opacity:.6;cursor:default}

/* gallery */
.wall{background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 3px,transparent 3px 7px),linear-gradient(180deg,#071b28,#0b2836);padding:80px 0 100px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:64px 48px;align-items:center;justify-items:center}
.piece{position:relative;cursor:zoom-in;border:0;background:none;padding:0;width:100%;display:flex;justify-content:center}
.piece::before{content:"";position:absolute;left:-10%;right:-10%;top:-50px;height:65%;background:radial-gradient(ellipse 50% 60% at 50% 0%,rgba(255,244,214,.18),transparent 70%);pointer-events:none}
.piece:focus-visible{outline:3px solid var(--ice);outline-offset:12px}

.frame{position:relative;display:inline-block;max-width:100%;transform:rotate(var(--tilt,0deg));transition:transform .5s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 18px 30px rgba(0,0,0,.45)}
.piece:hover .frame,.piece:focus-visible .frame{transform:rotate(0deg) scale(1.02)}
.frame img{display:block;width:100%;height:auto}
.frame .mat{position:relative}
/* ===== ALL-GOLD FRAMES (12 styles) ===== */
.frame{--g:linear-gradient(135deg,#6e4f15,#e9c66a 18%,#8a6420 34%,#f8e29a 50%,#9a7128 66%,#e2bd5f 82%,#6e4f15);
  --gb:linear-gradient(180deg,#fff3c0,#c9a03e 30%,#f6dc8a 50%,#a77c22 72%,#e8c869);
  --ga:linear-gradient(135deg,#3f2c0b,#9c7a2e 25%,#5e4413 45%,#c4a157 60%,#4a3410 85%)}

/* 1 gilt baroque */
.f-gilt{padding:20px;background:var(--g);box-shadow:inset 0 0 0 2px #4a330c,inset 0 0 0 5px #d9b45a,inset 0 0 0 7px #6d4d14,inset 0 0 14px 9px rgba(60,35,5,.55),0 18px 30px rgba(0,0,0,.5)}
.f-gilt::before{content:"";position:absolute;inset:8px;border:3px dotted rgba(255,236,170,.85);pointer-events:none}
.f-gilt .mat{padding:16px;background:#f1e8d2;box-shadow:inset 0 0 0 1px #bfa977,inset 3px 3px 8px rgba(0,0,0,.25)}

/* 2 slim gold, wide white mat */
.f-gallery{padding:8px;background:var(--gb);box-shadow:inset 0 0 0 1px #7a5718,0 18px 30px rgba(0,0,0,.45)}
.f-gallery .mat{padding:34px;background:#fbfbf8;box-shadow:inset 0 0 0 1px #d8d2bf}
.f-gallery .mat img{box-shadow:0 0 0 1px #cfc6a8}

/* 3 gold float: photo floats on cream with shadow */
.f-polaroid{padding:12px;background:var(--g);box-shadow:inset 0 0 0 2px #5b3f10,0 18px 30px rgba(0,0,0,.45)}
.f-polaroid .mat{padding:28px;background:#efe7d4;box-shadow:inset 0 4px 10px rgba(0,0,0,.25)}
.f-polaroid .mat img{box-shadow:0 10px 16px rgba(0,0,0,.35)}

/* 4 antique carved gold */
.f-wood{padding:24px;background:repeating-linear-gradient(45deg,rgba(255,230,150,.10) 0 2px,transparent 2px 6px),var(--ga);
  box-shadow:inset 0 0 0 3px #2e1f06,inset 0 0 0 7px #b38f45,inset 0 0 0 9px #2e1f06,inset 0 0 20px rgba(0,0,0,.6),0 18px 28px rgba(0,0,0,.5)}
.f-wood .mat{box-shadow:0 0 0 3px #d8b866,0 0 0 5px #3a2808}

/* 5 oval cameo */
.f-oval{padding:18px;border-radius:50%;background:linear-gradient(160deg,#5c3f10,#f2d27c 25%,#8b6421 45%,#f7e39f 60%,#7a5618 85%);
  box-shadow:inset 0 0 0 3px #3e2a08,inset 0 0 0 7px #e2c063,inset 0 0 0 9px #5c3f10,0 18px 30px rgba(0,0,0,.5)}
.f-oval .mat{border-radius:50%;overflow:hidden;background:#24180b;padding:10px}
.f-oval img{border-radius:50%;aspect-ratio:4/5;object-fit:cover}

/* 6 brushed modern gold */
.f-chrome{padding:13px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),var(--gb);
  box-shadow:inset 0 0 0 1px #6d4f14,inset 0 2px 0 #fff6cf,0 16px 26px rgba(0,0,0,.5)}
.f-chrome .mat{box-shadow:0 0 0 2px #5b4012}

/* 7 gold with AccPho-blue mat */
.f-accpho{padding:16px;background:var(--g);box-shadow:inset 0 0 0 2px #4a330c,inset 0 0 10px rgba(60,35,5,.5),0 18px 30px rgba(0,0,0,.5)}
.f-accpho .mat{padding:22px;background:linear-gradient(180deg,#2b7fb8,#1d5f8c);box-shadow:inset 0 0 0 1px #8cc8de,inset 0 3px 8px rgba(0,0,0,.35)}
.f-accpho .mat img{box-shadow:0 0 0 2px #e2c063}

/* 8 distressed flea-market gold */
.f-thrift{padding:20px;background:
  radial-gradient(circle at 12% 18%,#3b2a10 0 4px,transparent 5px),radial-gradient(circle at 86% 9%,#3b2a10 0 3px,transparent 4px),
  radial-gradient(circle at 93% 72%,#f4ead0 0 5px,transparent 6px),radial-gradient(circle at 6% 86%,#3b2a10 0 5px,transparent 6px),
  radial-gradient(circle at 55% 97%,#f4ead0 0 3px,transparent 4px),linear-gradient(135deg,#a8873e,#d8bd72 40%,#9c7c35 70%,#c9ab5e);
  box-shadow:inset 0 0 0 2px #5e4515,inset 0 0 12px rgba(0,0,0,.35),0 16px 26px rgba(0,0,0,.45)}
.f-thrift .mat{padding:8px;background:#f0e4c8;outline:1px solid #a88a48;outline-offset:-4px}

/* 9 gold, black mat, gold fillet */
.f-film{padding:12px;background:var(--g);box-shadow:inset 0 0 0 2px #4a330c,0 18px 30px rgba(0,0,0,.5)}
.f-film .mat{padding:26px;background:#141414}
.f-film .mat img{box-shadow:0 0 0 3px #141414,0 0 0 5px #d9b45a}

/* 10 gold shadowbox */
.f-shadowbox{padding:12px;background:var(--g);box-shadow:inset 0 0 0 2px #4a330c,0 18px 30px rgba(0,0,0,.55)}
.f-shadowbox .mat{padding:30px;background:#2a2118;box-shadow:inset 0 10px 22px rgba(0,0,0,.8),inset 0 -2px 6px rgba(255,220,150,.08)}
.f-shadowbox .mat img{box-shadow:0 14px 20px rgba(0,0,0,.6);transform:translateY(-3px)}

/* 11 art deco stepped gold */
.f-neon{padding:6px;background:var(--gb);box-shadow:0 18px 30px rgba(0,0,0,.5)}
.f-neon .mat{padding:6px;background:#1a1408;box-shadow:0 0 0 0 transparent}
.f-neon .mat::before{content:"";position:absolute;inset:0;border:5px solid transparent;border-image:var(--g) 1;pointer-events:none}
.f-neon .mat img{border:6px solid #1a1408;outline:3px solid #e2c063;outline-offset:-3px}
.f-neon::before,.f-neon::after{content:"";position:absolute;width:18px;height:18px;background:var(--g);box-shadow:inset 0 0 0 2px #4a330c}
.f-neon::before{top:-6px;left:-6px}.f-neon::after{bottom:-6px;right:-6px}

/* 12 gold with red velvet mat */
.f-velvet{padding:6px;background:linear-gradient(135deg,#c9a24a,#f5df98,#a57f2a);box-shadow:0 18px 30px rgba(0,0,0,.5)}
.f-velvet .mat{padding:26px;background:radial-gradient(ellipse at 30% 20%,#8d1a2b,#4d0a15 75%);box-shadow:inset 0 0 18px rgba(0,0,0,.6)}
.f-velvet .mat img{box-shadow:0 0 0 2px #d9b45a}

/* ===== ORNATE GOLD FRAMES (generated) ===== */
.frame.orn{padding:0;border-style:solid;border-color:transparent;background:transparent}
.frame.orn .mat{position:relative}
.frame.orn .topper{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
@media (max-width:520px){.frame.orn{border-width:calc(var(--bw)*.75)!important}}

.f-salon .mat{padding:24px;background:radial-gradient(ellipse at 30% 20%,#2f5a3e,#14301f 75%);box-shadow:inset 0 0 16px rgba(0,0,0,.6)}

/* lightbox */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,10,16,.95);display:none;align-items:center;justify-content:center;padding:28px;overflow:auto}
.overlay.open{display:flex}
.overlay .frame{--tilt:0deg}
.overlay .frame img{max-height:76vh;width:auto;max-width:82vw}
.x{position:fixed;top:16px;right:18px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer;z-index:60}

/* submit */
.submit{background:var(--paper);color:var(--ink);padding:84px 0}
.submit h2{font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;font-size:clamp(34px,4.6vw,52px);line-height:.95;margin:0 0 30px;color:var(--navy)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
@media (max-width:820px){.sgrid{grid-template-columns:1fr}}
.drop{position:relative;border:2px dashed #9fb4c2;border-radius:4px;background:#fff;padding:44px 20px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--sky);background:#f0f8fd}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop strong{display:block;font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:19px;color:var(--navy)}
.drop span{font-size:14px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:20px 0 6px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--sky);flex:none}
.empty{grid-column:1/-1;text-align:center;color:#cfe3ee;padding:40px 0}
.err{color:#b3261e;font-size:14px;min-height:1.3em;margin:6px 0 12px}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.easel{background:linear-gradient(180deg,#1d5f8c,#12324a);border-radius:4px;padding:40px 28px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;color:#cfe3ee}
.easel .frame{max-width:320px}
.easel svg{width:80px;height:80px;opacity:.6;display:block;margin:0 auto 12px}
.done{background:#fff;border:2px solid var(--sky);border-radius:4px;padding:26px}
.done strong{display:block;font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;font-size:26px;color:var(--navy);margin-bottom:6px}

footer{background:var(--deep);padding:30px 0;font-size:14px;color:#9fb8c7}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer em{font-weight:600;color:#fff}
footer a{color:#7d97a8;font-size:12px}

</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="logo" viewBox="-120 -120 240 240">
    <rect x="-48" y="-30" width="118" height="150" rx="12" fill="#2a1d14" transform="rotate(-9)"/>
    <g fill="#8cc8de">
      <polygon id="arrH" points="14,-7 88,-7 88,-19 114,0 88,19 88,7 14,7"/>
      <use href="#arrH" transform="rotate(180) scale(.78)"/><use href="#arrH" transform="rotate(-90) scale(.84)"/><use href="#arrH" transform="rotate(90) scale(.84)"/>
      <use href="#arrH" transform="rotate(-45) scale(.6)"/><use href="#arrH" transform="rotate(45) scale(.6)"/><use href="#arrH" transform="rotate(135) scale(.6)"/><use href="#arrH" transform="rotate(-135) scale(.6)"/>
    </g>
    <circle r="17" fill="#fff" stroke="#3b6f8a" stroke-width="4"/>

<header>
  <div class="wrap">
    <a class="lockup" href="#" aria-label="School of Accidental Photography">
      <svg aria-hidden="true"><use href="#logo"/></svg>
      <span>School of<br>Accidental<br>Photography</span>
    </a>
    <a class="btn light" href="#submit">Submit a photo</a>
  </div>
</header>

<main class="wall">
  <div class="wrap"><div class="grid" id="grid"></div></div>
</main>

<section class="submit" id="submit">
  <div class="wrap">
    <h2>Submit an accident</h2>
    <div class="sgrid">
      <form id="form" novalidate>
        <div class="drop" id="drop">
          <input type="file" id="file" accept="image/*" aria-label="Choose a photo">
          <strong>Choose a photo</strong>
          <span>or drop it here</span>
        </div>
        <input type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
        <label class="check"><input type="checkbox" id="ok"> I took this by accident, and AccPho may show it in the gallery.</label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" id="send">Submit</button>
        <p class="note">Photos appear in the gallery after review.</p>
      </form>
      <div class="done" id="done" hidden>
        <strong>Thanks!</strong>
        <span id="doneMsg"></span>
        <p><button class="btn" id="again">Submit another</button></p>
      </div>
      <div class="easel" id="easel"><div><svg aria-hidden="true"><use href="#logo"/></svg>Your photo will appear here, framed.</div></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <em>Suite 315 of Strange Bird Immersive</em>
  </div>
</footer>

<div class="overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
  <button class="x" data-close aria-label="Close">×</button>
  <div id="lbHang"></div>
</div>

    x.fillStyle="rgba(220,235,240,.35)";ell(x,-w*.42,-h*.38,w*.07,w*.07);x.fillStyle="#c7c7c7";x.fillRect(-w*.02,-h*.35,w*.012,h*.5);x.restore()},
  rain:(x,w,h,r)=>{x.fillStyle=lin(x,0,0,0,h,[[0,"#141c2a"],[1,"#202a36"]]);x.fillRect(0,0,w,h);
    for(let i=0;i<22;i++){const hue=[45,10,200,130][Math.floor(r()*4)];x.fillStyle=`hsla(${hue},85%,60%,${.35+r()*.4})`;ell(x,r()*w,h*.3+r()*h*.5,3+r()*6,3+r()*6)}},
  rainSharp:(o,w,h,r)=>{for(let i=0;i<120;i++){const cx=r()*w,cy=r()*h,rr=2+r()*7;const g=o.createRadialGradient(cx-rr*.3,cy-rr*.3,0,cx,cy,rr);
    g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(.6,"rgba(160,180,200,.12)");g.addColorStop(1,"rgba(0,0,0,.25)");o.fillStyle=g;o.beginPath();o.ellipse(cx,cy,rr*.85,rr,0,0,7);o.fill()}},
  fan:(x,w,h)=>{x.fillStyle=lin(x,0,0,0,h,[[0,"#ddd6c9"],[1,"#c3baa9"]]);x.fillRect(0,0,w,h);
    const cx=w*.48,cy=h*.5;for(let i=0;i<36;i++){x.save();x.translate(cx,cy);x.rotate(i*Math.PI/18);x.fillStyle="rgba(84,58,36,.07)";x.fillRect(0,-h*.05,w*.46,h*.1);x.restore()}
    x.fillStyle="#5b4430";ell(x,cx,cy,w*.06,w*.06);x.fillStyle=rad(x,cx,cy,w*.04,[[0,"#fffbe8"],[1,"#f0dca0"]]);ell(x,cx,cy,w*.035,w*.035)},
  pavement:(x,w,h,r)=>{x.fillStyle="#7c7972";x.fillRect(0,0,w,h);for(let i=0;i<300;i++){x.fillStyle=`rgba(${r()<.5?40:200},${r()<.5?40:200},${r()<.5?40:190},.2)`;x.fillRect(r()*w,r()*h,1,1)}
    x.save();x.translate(w*.2,0);x.rotate(.35);x.fillStyle="#d9b33a";x.fillRect(0,-h*.2,w*.05,h*1.6);x.restore();
    x.fillStyle="#23252b";ell(x,w*.95,h*.95,w*.22,h*.2,-.4);x.fillStyle="#f2f2f2";ell(x,w*.85,h*.87,w*.06,h*.02,-.4);
    x.fillStyle="#a8582b";ell(x,w*.4,h*.55,w*.04,h*.025,.8)}
};


const STANDINS=[["thumb",640,480],["ceiling",480,640],["pocket",640,480,"pocketSharp"],["floor",480,640],["night",640,420,"nightSharp"],["blink",640,480],
  ["horizon",640,460],["stop",480,600],["dinner",600,600],["rain",640,480,"rainSharp"],["fan",520,520],["pavement",640,480],
  ["night",480,600,"nightSharp"],["thumb",480,620],["rain",520,520,"rainSharp"],["floor",640,460],["ceiling",640,480],["dinner",480,600],
  ["horizon",480,600],["pocket",520,520,"pocketSharp"],["pavement",480,620],["stop",600,520],["fan",640,480],["blink",480,600]];
const STANDIN_FRAMES=["rococo","gallery","pearl","gilt","eggdart","shell","oval","greek","rope","velvet","laurel","chrome","scroll","dentil","accpho","palace",
  "reeded","wood","lattice","beaded","polaroid","rosegold","acanthus","salon"];

let photos=[], wall=[];

function frameFor(id,i){return FRAMES[(Math.abs(hash(id))+i)%FRAMES.length]}
function tiltFor(id){const r=rng(hash(id));return +((r()-.5)*5).toFixed(2)}
function frameHTML(p){
  const o=p.frame in ORNATE, top=o&&ORNATE[p.frame]?`<span class="topper topper-${ORNATE[p.frame]}"></span>`:"";
  return `<div class="frame f-${p.frame}${o?" orn":""}" style="--tilt:${p.tilt||0}deg"><div class="mat"><img src="${p.src}" alt="An accidental photograph" loading="lazy"></div>${top}</div>`;
}
function renderWall(){
  wall = SCRIPT_URL ? photos.map(p=>({...p}))
    : STANDINS.map(([sc,w,h,sh],i)=>({id:"s"+i,frame:STANDIN_FRAMES[i],src:shot(w,h,SCENES[sc],{sharp:sh?SCENES[sh]:null,seed:i*977+13,vig:sc==="blink"?.12:.55})}));
  wall.forEach((p,i)=>{p.frame=p.frame||FRAMES[Math.abs(hash(p.id))%FRAMES.length];p.tilt=tiltFor(p.id)});
  $("#grid").innerHTML = wall.length
    ? wall.map((p,i)=>`<button class="piece" data-i="${i}" aria-label="Enlarge photo ${i+1}">${frameHTML(p)}</button>`).join("")
    : `<p class="empty">No accidents on the wall yet.</p>`;
}

/* lightbox */
function openOv(id){$(id).classList.add("open");document.body.style.overflow="hidden"}
function closeAll(){document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("open"));document.body.style.overflow=""}
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".piece");if(!b)return;$("#lbHang").innerHTML=frameHTML({...wall[+b.dataset.i],tilt:0});openOv("#lightbox")});
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o||e.target.id==="lbHang")closeAll()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});

/* submit */
let draft=null;
const randFrame=()=>FRAMES[Math.floor(Math.random()*FRAMES.length)];
function downscale(file,max=1400,q=.84){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
const emptyEasel=$("#easel").innerHTML;
async function take(f){
  $("#err").textContent="";if(!f)return;
  try{draft={src:await downscale(f),frame:randFrame()}}catch(e){$("#err").textContent="Couldn't read that image. Try a JPG or PNG.";return}
  $("#easel").innerHTML=frameHTML({...draft,tilt:-1.2});
}
$("#file").addEventListener("change",e=>take(e.target.files[0]));
const drop=$("#drop");
["dragenter","dragover"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>take(e.dataTransfer.files[0]));

$("#form").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("#err");
  if(!draft){err.textContent="Choose a photo first.";return}
  if(!$("#ok").checked){err.textContent="Please check the box.";return}
  const b=$("#send");b.disabled=true;b.textContent="Sending…";let ok=false;
  if(SCRIPT_URL){
    try{
      const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({image:draft.src,frame:draft.frame,website:$("#website").value})});
      ok=(await r.json()).ok===true;
    }catch(_){}
  }else ok=true;
  b.disabled=false;b.textContent="Submit";
  if(!ok){err.textContent="Something went wrong. Please try again in a few minutes.";return}
  $("#doneMsg").textContent = SCRIPT_URL
    ? "Your photo has been sent for review. If it's approved, it will be framed and hung in the gallery."
    : "Demo mode: this page isn't connected to storage yet, so the photo wasn't sent anywhere.";
  $("#form").hidden=true;$("#done").hidden=false;
});
$("#again").onclick=()=>{$("#form").reset();draft=null;$("#err").textContent="";$("#easel").innerHTML=emptyEasel;$("#done").hidden=true;$("#form").hidden=false};


(async()=>{
  if(SCRIPT_URL){
    $("#grid").innerHTML=`<p class="empty">Hanging the photos…</p>`;
    try{const r=await fetch(SCRIPT_URL);photos=await r.json()}catch(_){photos=[]}
  }
  renderWall();
})();
</script>
</body>
</html>
